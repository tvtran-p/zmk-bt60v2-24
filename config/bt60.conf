# BT60 V2 configuration options (Kconfig).
# These are on/off + numeric firmware settings. They are NOT where debounce goes
# (debounce is a devicetree setting — see bt60.keymap).

# Enable deep sleep after idle to save battery.
CONFIG_ZMK_SLEEP=y

# Report battery level over BLE.
CONFIG_ZMK_BATTERY_REPORTING=y

# Uncomment to enable RGB underglow (this board has WS2812 LEDs):
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment to enable backlight:
# CONFIG_ZMK_BACKLIGHT=y
